services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=true"
      # Only route containers of this compose project, not other stacks on the host.
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`dashboard`)"
      - "--entrypoints.web.address=:80"
    ports:
      - 8088:8080  # Traefik dashboard
      - 8058:80      # HTTP
    volumes:
      - /run/user/210015162/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - default
      - traefik-proxy

  # Next.js frontend: public sound map + team area.
  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - "traefik.http.routers.tabmon__web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.tabmon__web.entrypoints=web"
      - "traefik.http.routers.tabmon__web.priority=1"
      - "traefik.http.services.tabmon__web.loadbalancer.server.port=3000"
    networks:
      - default
      - traefik-proxy

  # FastAPI + DuckDB. Reads tables and media directly from S3.
  api:
    build:
      context: ./api
    environment:
      RCLONE_CONFIG: /run/secrets/tabmon_rclone
      S3_BUCKET: ${S3_BUCKET:-bencretois-ns8129k-proj-tabmon}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-tabmon}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    secrets:
      - tabmon_rclone
    restart: unless-stopped
    labels:
      - "traefik.http.routers.tabmon__api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.tabmon__api.entrypoints=web"
      - "traefik.http.routers.tabmon__api.priority=20"
      - "traefik.http.services.tabmon__api.loadbalancer.server.port=8000"
    networks:
      - default
      - traefik-proxy

secrets:
  tabmon_rclone:
    file: ~/.config/rclone/rclone.conf

networks:
  default:
  traefik-proxy:
    external: false
