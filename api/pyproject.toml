[project]
name = "tabmon-api"
version = "0.1.0"
description = "Data API for the TABMON dashboard"
requires-python = ">=3.11"
license = {text = "GPL-3.0+"}
authors = [{name = "Benjamin Cretois", email = "benjamin.cretois@nina.no"}]
dependencies = [
  "boto3>=1.43.124",
  "duckdb>=1.2.0",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "pytz>=2026.6",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["COM812", "B008", "E501"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"tabmon_api/*" = ["S608"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
