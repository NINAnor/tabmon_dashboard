[dependency-groups]
dev = ["httpx2>=2.16.0", "pytest>=8", "ruff"]

[project]
authors = [{ name = "Benjamin Cretois", email = "benjamin.cretois@nina.no" }]
dependencies = [
  "boto3>=1.43.125",
  "duckdb>=1.2.0",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "pytz>=2026.6",
  "uvicorn[standard]>=0.32"
]
description = "Data API for the TABMON dashboard"
license = { text = "GPL-3.0+" }
name = "tabmon-api"
requires-python = ">=3.11"
version = "0.1.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["COM812", "B008", "E501"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]

[tool.ruff.lint.per-file-ignores]
"tabmon_api/*" = ["S608"]
"tests/*" = ["S101", "S105", "S106"]
